name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Setup devenv
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install devenv
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt', '**/project/build.properties', '**/project/plugins.sbt') }}
          restore-keys: |
            sbt-

      - name: Build with devenv
        run: |
          devenv shell npm ci
          devenv shell make -C feel-scala
          devenv shell npm run format:check
          devenv shell npm run lint
          devenv shell npm run test:coverage
          devenv shell npm run build

      - name: Upload coverage to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
